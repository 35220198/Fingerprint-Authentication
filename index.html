<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fingerprint Authentication System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- shared fingerprint drawing -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="fpClip"><ellipse cx="100" cy="110" rx="86" ry="104"/></clipPath>
      <symbol id="fp" viewBox="0 0 200 220">
        <g clip-path="url(#fpClip)" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
          <ellipse cx="100" cy="116" rx="12" ry="16"/>
          <ellipse cx="100" cy="116" rx="24" ry="32" stroke-dasharray="120 14 40 12"/>
          <ellipse cx="100" cy="116" rx="36" ry="48" stroke-dasharray="150 10 70 16"/>
          <ellipse cx="100" cy="116" rx="48" ry="64" stroke-dasharray="190 12 90 10"/>
          <ellipse cx="100" cy="116" rx="60" ry="80" stroke-dasharray="230 14 120 12"/>
          <ellipse cx="100" cy="116" rx="72" ry="96" stroke-dasharray="270 10 150 16"/>
          <ellipse cx="100" cy="116" rx="84" ry="112" stroke-dasharray="320 16 190 12"/>
          <ellipse cx="100" cy="116" rx="96" ry="128" stroke-dasharray="360 12 230 18"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <main class="stage">
    <section class="panel" aria-label="Fingerprint Authentication">

      <header class="head">
        <svg class="head-ico" aria-hidden="true"><use href="#fp"/></svg>
        <h1>Fingerprint Authentication</h1>
      </header>

      <div class="scanner-wrap">
        <div class="scanner" id="scanner" aria-hidden="true">
          <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
          <svg class="fp"><use href="#fp"/></svg>
          <div class="beam"></div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Place your finger...</p>
        <p class="mode" id="mode">Checking device&hellip;</p>
      </div>

      <div class="btns">
        <button type="button" class="b reg" id="regBtn">
          <svg aria-hidden="true"><use href="#fp"/></svg><span>Register<br>Fingerprint</span>
        </button>
        <button type="button" class="b log" id="logBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3zm3 4a2 2 0 0 1 1 3.7V20h-2v-2.300A2 2 0 0 1 12 14z"/></svg><span>Login with<br>Fingerprint</span>
        </button>
      </div>

      <section class="users" aria-label="Registered users">
        <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3 0-7 1.500-7 4.500V20h14v-2.500C16 14.500 12 13 9 13zm8 0c-.4 0-.8 0-1.200.1 1.300.9 2.200 2.200 2.200 4.400V20h4v-2.500c0-2.500-3-4.500-5-4.500z"/></svg>Registered Users</h2>
        <p class="hint" id="hint" hidden>Tap your name, then press Login.</p>
        <ul id="userList"></ul>
      </section>

      <div class="result" id="result" role="alert" hidden>
        <span class="r-ico" id="rIco">&#10003;</span>
        <div><strong id="rTitle">Authentication Successful!</strong><span id="rText"></span></div>
      </div>
    </section>
  </main>

  <!-- name prompt -->
  <dialog id="dlg">
    <form id="dlgForm" novalidate>
      <h3>Register Fingerprint</h3>
      <label>Your name<input id="nameIn" type="text" maxlength="30" autocomplete="name"></label>
      <p class="derr" id="derr" role="alert"></p>
      <div class="dbtns">
        <button type="button" class="ghost" id="dCancel">Cancel</button>
        <button type="submit" class="go">Continue</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
